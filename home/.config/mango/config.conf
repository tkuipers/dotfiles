# Mango, kept in step with the sway config: same keys, apps and look.
# Colours come from the theme (Alt+Shift+t picks one); theme-apply renders them.
source-optional=~/.local/state/theme/mango/theme.conf

# The left monitor is the first viewer, the right one the second
monitorrule=name:^Virtual-1$,x:0,y:0,scale:1
monitorrule=name:^Virtual-2$,x:1920,y:0,scale:1

env=XCURSOR_THEME,catppuccin-mocha-lavender-cursors
env=XCURSOR_SIZE,24

# Autostart, as in the sway config
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=~/.local/bin/win-media-keys
exec-once=~/.local/bin/health-log
exec-once=~/.local/bin/win-to-clipboard
exec-once=wl-paste --type text --watch ~/.local/bin/clipboard-to-win text
exec-once=wl-paste --type image/png --watch ~/.local/bin/clipboard-to-win image
exec-once=wl-paste --type text --watch cliphist store
exec-once=wl-paste --type image/png --watch cliphist store
exec-once=alacritty --class startup-term
exec-once=teams-for-linux
exec-once=prospect-mail
exec-once=env GSK_RENDERER=cairo swaync -s ~/.local/state/theme/swaync/style.css
exec-once=~/.local/bin/waybar-themed
exec-once=awww-daemon
exec-once=~/.local/bin/wallpaper-cycle
# Outputs follow the viewer windows, as in sway
exec-once=~/.local/bin/fit-outputs
# Every config load, like sway's exec_always
exec=~/.local/bin/theme-apply

# Look: SwayFX's numbers, through the same scenefx
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=4
blur_params_noise=0.02
blur_params_saturation=1.1
shadows=1
layer_shadows=1
shadow_only_floating=0
shadows_size=24
shadows_blur=24
shadows_position_y=4
border_radius=10
borderpx=2
# glass-unfocused's numbers, built in here
focused_opacity=0.96
unfocused_opacity=0.835
gappih=5
gappiv=5
gappoh=3
gappov=3

# Windows zoom open from 60% with a slight overshoot, slide when they move,
# and tags slide sideways. Focus changes fade the opacity across.
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
layer_animation_type_open=slide
layer_animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
zoom_initial_ratio=0.6
zoom_end_ratio=0.85
fadein_begin_opacity=0.3
fadeout_begin_opacity=0.9
tag_animation_direction=1
animation_duration_open=350
animation_duration_close=300
animation_duration_move=400
animation_duration_tag=380
animation_duration_focus=220
animation_curve_open=0.34,1.36,0.64,1
animation_curve_move=0.22,1.18,0.36,1
animation_curve_tag=0.16,1,0.3,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadein=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5

# The launcher and logout screen zoom; bars and notifications slide from their edge
layerrule=animation_type_open:zoom,animation_type_close:zoom,layer_name:^(wofi|logout_dialog)$
layerrule=noanim:1,layer_name:^awww

# Overview (Alt+Tab, or push the pointer into the bottom-left corner) shows every
# window on the monitor; click one to go to it
enable_hotarea=1
hotarea_size=10
overviewgappi=10
overviewgappo=40

# Alt+s's scroller: columns like niri. Alt+p steps the column through these widths
scroller_default_proportion=0.7
scroller_proportion_preset=0.5,0.7,1.0
scroller_focus_center=0
scroller_prefer_center=1
scroller_structs=24
edge_scroller_pointer_focus=1

# Floating windows snap to edges and each other
enable_floating_snap=1
snap_distance=24

# Behaviour like sway's: focus follows the mouse, Alt drags windows
sloppyfocus=1
warpcursor=0
focus_on_activate=0
cursor_size=24
xkb_rules_layout=us
scratchpad_width_ratio=0.7
scratchpad_height_ratio=0.6

# Workspaces 1-9 are tags; every monitor has its own set. Tiling like sway's
# by default; Alt+n cycles through the other layouts (scroller, grid, ...).
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Apps on the same workspaces as in sway
windowrule=tags:1,monitor:Virtual-1,appid:^(brave-browser|Brave-browser)$
windowrule=tags:2,monitor:Virtual-2,appid:^startup-term$
windowrule=tags:3,appid:^(code|Code|code-oss|cursor|Cursor|neovide|nvim-qt)$
windowrule=tags:4,appid:^(teams-for-linux|teams|microsoft-teams)$
windowrule=tags:5,appid:^[Cc]ider$
windowrule=tags:6,appid:^prospect-mail$
windowrule=isnamedscratchpad:1,width:1344,height:648,appid:^scratchterm$
windowrule=isnamedscratchpad:1,width:576,height:486,appid:^scratchnotes$
windowrule=isnamedscratchpad:1,width:864,height:594,appid:^scratchmixer$
windowrule=isfloating:1,appid:^(com.gabm.satty|qemu|zenmonitor|mpv|imv|timeshift-gtk|telegram-desktop)$
windowrule=isfloating:1,title:^((Open|Save) (File|Folder|As)|File Upload|Picture-in-Picture)$
# Scratchpads drop in from the top rather than zooming
windowrule=animation_type_open:slide,animation_type_close:slide,appid:^(scratchterm|scratchnotes|scratchmixer)$
# Video and pictures stay fully opaque
windowrule=focused_opacity:1.0,unfocused_opacity:1.0,appid:^(mpv|imv)$
windowrule=focused_opacity:1.0,unfocused_opacity:1.0,title:^Picture-in-Picture$

# Keys: the sway bindings, Alt as the modifier
keymode=default
bind=ALT,Return,spawn,alacritty
bind=ALT+SHIFT,q,killclient
bind=ALT,d,spawn,wofi
bind=ALT+SHIFT,c,reload_config
bind=ALT+SHIFT,t,spawn,~/.local/bin/theme-set
bind=ALT+SHIFT,w,spawn,~/.local/bin/session-switch
bind=ALT+SHIFT,e,spawn,wlogout
bind=ALT+SHIFT,s,spawn,~/.local/bin/screenshot
bind=ALT+SHIFT,v,spawn,~/.local/bin/clipboard-pick
bind=ALT+SHIFT,m,spawn,~/.local/bin/scratch-toggle mixer
bind=ALT,space,spawn,~/.local/bin/scratch-tap

bind=ALT,h,focusdir,left
bind=ALT,j,focusdir,down
bind=ALT,k,focusdir,up
bind=ALT,l,focusdir,right
bind=ALT,Left,focusdir,left
bind=ALT,Down,focusdir,down
bind=ALT,Up,focusdir,up
bind=ALT,Right,focusdir,right
bind=ALT+SHIFT,h,exchange_client,left
bind=ALT+SHIFT,j,exchange_client,down
bind=ALT+SHIFT,k,exchange_client,up
bind=ALT+SHIFT,l,exchange_client,right
bind=ALT+SHIFT,Left,exchange_client,left
bind=ALT+SHIFT,Down,exchange_client,down
bind=ALT+SHIFT,Up,exchange_client,up
bind=ALT+SHIFT,Right,exchange_client,right

bind=ALT,1,view,1,0
bind=ALT,2,view,2,0
bind=ALT,3,view,3,0
bind=ALT,4,view,4,0
bind=ALT,5,view,5,0
bind=ALT,6,view,6,0
bind=ALT,7,view,7,0
bind=ALT,8,view,8,0
bind=ALT,9,view,9,0
bind=ALT+SHIFT,1,tagsilent,1
bind=ALT+SHIFT,2,tagsilent,2
bind=ALT+SHIFT,3,tagsilent,3
bind=ALT+SHIFT,4,tagsilent,4
bind=ALT+SHIFT,5,tagsilent,5
bind=ALT+SHIFT,6,tagsilent,6
bind=ALT+SHIFT,7,tagsilent,7
bind=ALT+SHIFT,8,tagsilent,8
bind=ALT+SHIFT,9,tagsilent,9
bind=ALT+SHIFT,greater,tagmon,right
bind=ALT+SHIFT,less,tagmon,left

bind=ALT,f,togglefullscreen
bind=ALT+SHIFT,space,togglefloating
bind=ALT,n,switch_layout
bind=ALT,w,setlayout,deck
bind=ALT,s,setlayout,scroller
bind=ALT,e,setlayout,tile
bind=ALT,Tab,toggleoverview
bind=ALT,p,switch_proportion_preset
bind=ALT+SHIFT,f,togglemaximizescreen
bind=ALT+SHIFT,g,toggleglobal
bind=ALT+CTRL,h,viewtoleft_have_client,0
bind=ALT+CTRL,l,viewtoright_have_client,0
bind=ALT+CTRL,Left,viewtoleft_have_client,0
bind=ALT+CTRL,Right,viewtoright_have_client,0
bind=ALT,equal,incgaps,2
bind=ALT+SHIFT,equal,togglegaps
bind=ALT,minus,toggle_scratchpad
bind=ALT+SHIFT,minus,minimized
bind=ALT,r,setkeymode,resize

mousebind=ALT,btn_left,moveresize,curmove
mousebind=ALT,btn_right,moveresize,curresize
# Alt+scroll walks through the occupied tags
axisbind=ALT,UP,viewtoleft_have_client,0
axisbind=ALT,DOWN,viewtoright_have_client,0

# Resize mode, as sway's Alt+r
keymode=resize
bind=NONE,h,resizewin,-10,0
bind=NONE,j,resizewin,0,+10
bind=NONE,k,resizewin,0,-10
bind=NONE,l,resizewin,+10,0
bind=NONE,Left,resizewin,-10,0
bind=NONE,Down,resizewin,0,+10
bind=NONE,Up,resizewin,0,-10
bind=NONE,Right,resizewin,+10,0
bind=NONE,Return,setkeymode,default
bind=NONE,Escape,setkeymode,default
