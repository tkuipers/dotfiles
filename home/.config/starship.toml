palette = "catppuccin_mocha"

[character]
# Note the use of Catppuccin color 'maroon'
success_symbol = "[[♥](green) ❯](maroon)"
error_symbol = "[[✱](red) ❯](red)"
vimcmd_symbol = "[❮](green)"

[username]
show_always = true

[directory]
read_only = " 🔒 "
truncate_to_repo = false
style = "bold teal"

[aws]
symbol = "🖥️ "

[nix_shell]
disabled = true

[time]
disabled = false
format = '[$time]($style) '
time_format = '%T'
utc_time_offset = '-6'

[cmd_duration]
style = "bold sky"

[git_branch]
style = "bold peach"

