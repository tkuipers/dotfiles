palette = "catppuccin_mocha"
add_newline = true
# accent is the folder pill and the arrow. .bashrc swaps it to show how the last
# command went: blue fine, pink failed, yellow cancelled with Ctrl+C.
format = """[](fg:accent)$directory${custom.no_repo}$git_branch$git_status$kubernetes[](fg:surface0) $aws$cmd_duration
$character"""

[character]
success_symbol = "[❯](accent)"
error_symbol = "[❯](accent)"
vimcmd_symbol = "[❮](accent)"

[directory]
format = "[ $path$read_only ](bg:accent fg:crust bold)"
read_only = " 󰌾"
truncation_length = 3
truncate_to_repo = false

[git_branch]
format = "[](fg:accent bg:surface1)[  $branch ](bg:surface1 fg:text)"

[git_status]
stashed = ""
format = "([$all_status$ahead_behind ](bg:surface1 fg:yellow))[](fg:surface1 bg:surface0)"

# Outside a repo there is no git pill, so the folder joins the next one itself
[custom.no_repo]
command = "echo x"
when = "! git rev-parse --git-dir >/dev/null 2>&1"
shell = ["sh"]
format = "[](fg:accent bg:surface0)"

[kubernetes]
disabled = false
format = "[ 󱃾 $context( / $namespace) ](bg:surface0 fg:subtext0)"

# EKS contexts are whole ARNs: the cluster name is enough
[[kubernetes.contexts]]
context_pattern = "arn:aws:eks:[^:]+:[0-9]+:cluster/(?P<cluster>.+)"
context_alias = "$cluster"

[aws]
format = "([󰅣 $profile](sapphire) )"

[cmd_duration]
format = "[󰔛 $duration]($style) "
style = "sky"

