# D-Bus can start swaync through this service, so it needs the themed style too
[Service]
# GL on d3d12 stalls ~350 ms on every open, leaving 2 frames of the slide. Cairo gets 15.
Environment=GSK_RENDERER=cairo
ExecStart=
ExecStart=/run/current-system/sw/bin/swaync -s %h/.local/state/theme/swaync/style.css
